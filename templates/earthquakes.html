<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Recent Earthquakes (≥ M3.0)</title>
  <style>
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f5f6fa; margin: 20px; }
    h1 { text-align: center; color: #273c75; }
    table { width: 90%; margin: 20px auto; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    th, td { padding: 12px 15px; border-bottom: 1px solid #ddd; }
    th { background-color: #273c75; color: white; }
    tr:hover { background-color: #f1f2f6; }
    /* Map container UI */
    #map-container { position: relative; }
    .map-close-button {
      position: absolute;
      right: 12px;
      top: 8px;
      background: #ff4757;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <h1>Recent Earthquakes (≥ M3.0)</h1>
  <table id="eq-table">
    <thead>
      <tr><th>Date</th><th>Time</th><th>Magnitude</th><th>Depth</th><th>Location</th><th>Coordinates</th></tr>
    </thead>
    <tbody>
      {% for eq in earthquakes %}
      <tr class="eq-row" data-lat="{{ eq.latitude or '' }}" data-lon="{{ eq.longitude or '' }}" data-radius="{{ eq.radius_m or '' }}">
        <td>{{ eq.date }}</td>
        <td>{{ eq.time }}</td>
        <td>{{ eq.magnitude }}</td>
        <td>{{ eq.depth }}</td>
        <td>{{ eq.location }}</td>
        <td>{% if eq.latitude and eq.longitude %}{{ eq.latitude }}, {{ eq.longitude }}{% else %}N/A{% endif %}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <!-- Map container - appears when a row is clicked -->
  <div id="map-container" style="width:90%; margin:20px auto; display:none;">
    <button id="close-map" class="map-close-button" title="Close map">Close</button>
    <div id="map" style="height:400px; border-radius:8px; overflow:hidden;"></div>
    <div id="map-info" style="margin-top:8px; font-size:14px; color:#333;"></div>
  </div>

  <!-- Using Google Maps embed for map popups (no Leaflet required) -->

  <script>
    // Helper to create/center map when a row is clicked
    let map = null;
    let marker = null;
    let circle = null;

    // Client-side fallback place -> coordinates mapping (keeps UI responsive when server-provided coords are missing)
    const PLACE_COORDS = {
      "manila": [14.5995, 120.9842],
      "quezon city": [14.6760, 121.0437],
      "cebu": [10.3157, 123.8854],
      "cebu city": [10.3157, 123.8854],
      "davao": [7.1907, 125.4553],
      "davao city": [7.1907, 125.4553],
      "davao occidental": [6.75, 124.0],
      "davao oriental": [8.7, 126.5],
      "davao del sur": [6.75, 125.25],
      "occidental mindoro": [13.1333, 120.4833],
      "batangas": [13.7565, 121.0583],
      "zambales": [15.1980, 119.9806],
      "abra": [17.6495, 120.6169],
      "ilocos sur": [17.5669, 120.3832],
      "sarangani": [6.0590, 125.1581],
      "batanes": [20.4470, 121.9803],
      "palawan": [9.8349, 118.7381]
    };

    function estimateLatLonJS(locationText) {
      if (!locationText) return null;
      let text = ("" + locationText).trim();
      // prefer parenthetical content
      let candidate = null;
      const paren = text.match(/\(([^)]+)\)/);
      if (paren) candidate = paren[1].trim();
      else if (/\bof\b/i.test(text)) {
        const parts = text.split(/\bof\b/i);
        candidate = parts[parts.length - 1].trim();
      } else if (text.indexOf(',') !== -1) {
        const parts = text.split(',');
        candidate = parts[parts.length - 1].trim();
      } else {
        candidate = text;
      }

      const cand = candidate.toLowerCase();
      // Direct lookup
      if (PLACE_COORDS[cand]) return { lat: PLACE_COORDS[cand][0], lon: PLACE_COORDS[cand][1], method: 'lookup' };

      // Substring match
      for (const key in PLACE_COORDS) {
        if (cand.indexOf(key) !== -1) return { lat: PLACE_COORDS[key][0], lon: PLACE_COORDS[key][1], method: 'match' };
      }

      // Token matching
      const tokens = cand.split(/\W+/);
      for (const t of tokens) {
        if (!t) continue;
        for (const key in PLACE_COORDS) {
          if (key.indexOf(t) !== -1 || t.indexOf(key) !== -1) return { lat: PLACE_COORDS[key][0], lon: PLACE_COORDS[key][1], method: 'token' };
        }
      }
      return null;
    }
    function showMap(lat, lon, radius, infoHtml) {
      const container = document.getElementById('map-container');
      container.style.display = 'block';

      // Clear previous content
      const mapEl = document.getElementById('map');
      mapEl.innerHTML = '';

      function getZoomForRadius(r) {
        if (!r) return 12;
        if (r > 200000) return 6;
        if (r > 100000) return 7;
        if (r > 50000) return 8;
        if (r > 20000) return 9;
        if (r > 10000) return 10;
        if (r > 5000) return 11;
        return 12;
      }

      const zoom = getZoomForRadius(radius);

      // Create Google Maps embed iframe centered on coordinates
      const src = `https://www.google.com/maps?q=${encodeURIComponent(lat + "," + lon)}&z=${zoom}&output=embed`;
      const iframe = document.createElement('iframe');
      iframe.src = src;
      iframe.width = '100%';
      iframe.height = '400';
      iframe.style.border = '0';
      iframe.loading = 'lazy';
      mapEl.appendChild(iframe);

      document.getElementById('map-info').innerHTML = infoHtml || '';
    }

    // Attach click listeners to table rows
    document.addEventListener('DOMContentLoaded', function() {
      document.querySelectorAll('#eq-table .eq-row').forEach(function(row) {
        row.style.cursor = 'pointer';
        row.addEventListener('click', function() {
          const lat = row.getAttribute('data-lat');
          const lon = row.getAttribute('data-lon');
          const radius = row.getAttribute('data-radius');
          const date = row.cells[0].innerText || '';
          const time = row.cells[1].innerText || '';
          const mag = row.cells[2].innerText || '';
          const depth = row.cells[3].innerText || '';
          const location = row.cells[4].innerText || '';
          if (!lat || !lon) {
            // Try client-side estimation from the location text (city/province) so we can still show an approximate map
            const est = estimateLatLonJS(location);
            if (est) {
              const approxInfo = `<strong>${location} (approx)</strong><br/>${date} ${time} — M${mag} — depth ${depth}<br/>Coordinates estimated by: ${est.method}`;
              showMap(Number(est.lat), Number(est.lon), radius ? Number(radius) : null, approxInfo);
              return;
            }

            // If estimation fails, show a friendly message
            if (map) { try { map.remove(); } catch(e){} map = null; marker = null; circle = null; }
            document.getElementById('map-container').style.display = 'block';
            document.getElementById('map').innerHTML = '<div style="padding:20px;">Latitude/longitude not available for this record.</div>';
            document.getElementById('map-info').innerText = `${date} ${time} — ${location} — M${mag} — depth ${depth}`;
            return;
          }

          const infoHtml = `<strong>${location}</strong><br/>${date} ${time} — M${mag} — depth ${depth}<br/>Radius: ${radius ? (Number(radius).toLocaleString() + ' m') : 'N/A'}`;
          showMap(Number(lat), Number(lon), radius ? Number(radius) : null, infoHtml);
        });
      });

      // Close map button
      const closeBtn = document.getElementById('close-map');
      if (closeBtn) {
        closeBtn.addEventListener('click', function() {
          const container = document.getElementById('map-container');
          container.style.display = 'none';
          // remove map instance so subsequent opens reinitialize cleanly
          if (map) { try { map.remove(); } catch(e){} map = null; marker = null; circle = null; }
        });
      }
    });
  </script>
</body>
</html>
